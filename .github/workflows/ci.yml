name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela runs obsoletos del mismo branch/PR para no acumular colas
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions pineadas por commit SHA (protección supply-chain: un tag mutable
# o una cuenta comprometida no puede alterar lo que ejecuta el CI). El
# comentario con la versión permite seguir las actualizaciones de Dependabot
# (ecosystem github-actions en .github/dependabot.yml).

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx astro check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  build:
    runs-on: ubuntu-latest
    env:
      SANITY_PROJECT_ID: s22b9256
      SANITY_DATASET: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lighthouse CI
        if: github.event_name == 'pull_request'
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.json
          urls: |
            http://127.0.0.1:4321/
            http://127.0.0.1:4321/entrevistas/
          uploadArtifacts: true
