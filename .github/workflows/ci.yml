name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela runs obsoletos del mismo branch/PR para no acumular colas
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx astro check

  build:
    runs-on: ubuntu-latest
    env:
      SANITY_PROJECT_ID: s22b9256
      SANITY_DATASET: staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
