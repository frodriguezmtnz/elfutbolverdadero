name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela runs obsoletos del mismo branch/PR para no acumular colas
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx astro check

  build:
    runs-on: ubuntu-latest
    env:
      SANITY_PROJECT_ID: s22b9256
      SANITY_DATASET: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lighthouse CI
        if: github.event_name == 'pull_request'
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          urls: |
            http://127.0.0.1:4321/
            http://127.0.0.1:4321/entrevistas/
          uploadArtifacts: true
